{% extends "base.html" %}
{% load static %}

{% block title %}
Delete Task
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css_files/task_delete.css' %}">
{% endblock %}

{% block content %}
<section class="delete-page">
  <div class="delete-container">

    <!-- Left side image -->
    <div class="delete-image">
      <img src="{% static 'images/delete_task.png' %}" alt="Delete Task">
    </div>

    <!-- Delete card -->
    <div class="delete-card">
      <div class="delete-icon">
        <i class="bi bi-trash"></i>
      </div>

      <h1>
        Delete Task?
      </h1>

      <p class="delete-question">
        Are you sure you want to delete this task?
      </p>

      <h2 id="taskTitle">
        Loading...
      </h2>

      <div id="messageBox"></div>
      <div class="delete-actions">

        <button id="deleteButton" class="btn delete-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill"
            viewBox="0 0 16 16">
            <path
              d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
          </svg>
          Delete Task
        </button>

        <button id="cancelButton" class="btn cancel-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-x-lg"
            viewBox="0 0 16 16">
            <path
              d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
          </svg>
          Cancel
        </button>

      </div>
    </div>
  </div>
</section>

{% endblock %}

{% block extra_js %}
<script src="{% static 'javascript_files/task_delete.js' %}">
</script>
{% endblock %}
