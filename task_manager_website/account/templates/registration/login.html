{% extends "base.html" %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css_files/login.css' %}">
{% endblock %}

{% block content %}
<main class="login-page">
  <section class="login-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          <article class="login-card">
            <header class="login-header">
              <h1>
                Welcome Back
              </h1>

              <p>
                Continue organizing your tasks peacefully.
              </p>
            </header>

            <form id="loginForm" novalidate>
              {% csrf_token %}
              <div class="form-group">
                <label for="username">
                  Username
                </label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required>
              </div>

              <div class="form-group">
                <label for="password">
                  Password
                </label>
                <input type="password" id="password" name="password" class="form-control"
                  autocomplete="current-password" required>
              </div>

              <div id="loginError" class="login-error" role="alert">
              </div>
              <button type="submit" class="login-button" id="loginButton">
                Login
              </button>
            </form>
          </article>
        </div>
      </div>
    </div>
  </section>
</main>

{% endblock %}

{% block extra_js %}

<script src="{% static 'javascript_files/login.js' %}"></script>

{% endblock %}
